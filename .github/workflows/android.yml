name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug assembleRelease lintDebug assembleDebugAndroidTest
      - name: Build summary
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = ET.parse('app/build/reports/lint-results-debug.xml').getroot()
          errors = sum(issue.get('severity') == 'Error' for issue in report.findall('issue'))
          assert errors == 0
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Debug APK, release APK, and device-test APK compiled successfully.\n\n')
              summary.write(f'Android lint: {errors} errors.\n\n')
              summary.write('Installable signed APKs are distributed through [GitHub Releases](https://github.com/dkdannyboy/screenon/releases/latest). CI does not consume Actions artifact storage.\n')
          PYTHON
